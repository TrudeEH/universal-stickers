[package]
name = "universal-stickers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "universal-stickers"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ashpd = { version = "0.13", default-features = true, features = ["global_shortcuts"] }
dirs = "6.0"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
libadwaita = { version = "0.9", features = ["v1_9", "gtk_v4_20"] }
universal-stickers-core = { path = "../core" }

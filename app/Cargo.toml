[package]
name = "universal-stickers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "universal-stickers"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
universal-stickers-core = { path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = true, features = ["global_shortcuts"] }
futures-util = "0.3"

name: Build And Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev libadwaita-1-dev libgtk-4-dev pkg-config rpm

      - name: Test Rust core
        run: cargo test -p universal-stickers-core

      - name: Build desktop app
        run: cargo build --release --locked -p universal-stickers

      - name: Package Linux artifacts
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          mkdir -p dist
          rm -rf pkgroot
          DESTDIR="$PWD/pkgroot" PREFIX=/usr ./scripts/install-linux.sh

          mkdir -p pkgroot/DEBIAN
          cat > pkgroot/DEBIAN/control <<CONTROL
          Package: universal-stickers
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Universal Stickers Maintainers
          Depends: libadwaita-1-0, libgtk-4-1, xdg-desktop-portal
          Description: Small sticker and GIF picker built with GTK and Rust.
          CONTROL
          dpkg-deb --build pkgroot "dist/universal-stickers_${version}_amd64.deb"

          mkdir -p rpm/BUILD rpm/RPMS rpm/SOURCES rpm/SPECS rpm/SRPMS
          tar -C pkgroot --owner=0 --group=0 -czf "rpm/SOURCES/universal-stickers-root.tar.gz" .
          cat > rpm/SPECS/universal-stickers.spec <<SPEC
          Name: universal-stickers
          Version: ${version}
          Release: 1%{?dist}
          Summary: Small sticker and GIF picker built with GTK and Rust
          License: MIT
          URL: https://github.com/TrudeEH/universal-stickers
          Requires: gtk4
          Requires: libadwaita
          Requires: xdg-desktop-portal
          Source0: universal-stickers-root.tar.gz

          %description
          Small sticker and GIF picker built with GTK and Rust.

          %prep
          %setup -q -c -T

          %install
          mkdir -p %{buildroot}
          tar -xzf %{SOURCE0} -C %{buildroot}

          %files
          /usr/bin/universal-stickers
          /usr/share/applications/dev.trude.UniversalStickers.desktop
          /usr/share/metainfo/dev.trude.UniversalStickers.metainfo.xml
          /usr/share/icons/hicolor/scalable/apps/dev.trude.UniversalStickers.svg
          /usr/share/doc/universal-stickers/README.md
          /usr/share/doc/universal-stickers/LICENSE.txt
          SPEC
          rpmbuild --define "_topdir $PWD/rpm" -bb rpm/SPECS/universal-stickers.spec
          cp rpm/RPMS/*/*.rpm dist/

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-stickers-linux
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: universal-stickers-linux.flatpak
          manifest-path: desktop/packaging/dev.trude.UniversalStickers.yml
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-stickers-flatpak
          path: universal-stickers-linux.flatpak
          if-no-files-found: error

  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed cargo git gtk4 libadwaita xdg-desktop-portal-gnome
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/desktop/packaging/arch/universal-stickers-git' && makepkg --noconfirm --cleanbuild --clean --needed"
          mkdir -p dist
          cp desktop/packaging/arch/universal-stickers-git/*.pkg.tar.zst dist/

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-stickers-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - linux
      - flatpak
      - arch
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.flatpak
            release-assets/**/*.pkg.tar.zst
          body: |
            Automated build artifacts for commit `${{ github.sha }}` on `${{ github.ref_name }}`.

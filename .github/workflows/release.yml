name: Build And Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: universal-stickers-windows
          - os: ubuntu-24.04
            label: Linux
            artifact_name: universal-stickers-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          archives: "qtbase qtsvg"
          cache: true
          install-deps: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev dpkg-dev rpm

      - name: Install Inkscape on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install inkscape --yes --no-progress

      - name: Render Windows icon assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\render-icons.ps1 -SvgPath .\icon.svg -OutputDir .\desktop\resources\icons

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build desktop app
        run: cmake --build desktop/build --config Release

      - name: Install WiX toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.4
          $env:PATH = "$env:USERPROFILE\\.dotnet\\tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/4.0.4

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:PATH = "$env:USERPROFILE\\.dotnet\\tools;$env:PATH"
          cpack --config desktop/build/CPackConfig.cmake -C Release -G ZIP -B dist
          cpack --config desktop/build/CPackConfig.cmake -C Release -G WIX -B dist

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cpack --config desktop/build/CPackConfig.cmake -C Release -G DEB -B dist
          cpack --config desktop/build/CPackConfig.cmake -C Release -G RPM -B dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: universal-stickers-linux.flatpak
          manifest-path: desktop/packaging/dev.trude.UniversalStickers.yml
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-stickers-flatpak
          path: universal-stickers-linux.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - build
      - flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.flatpak
          body: |
            Automated build artifacts for commit `${{ github.sha }}` on `${{ github.ref_name }}`.

id: dev.trude.UniversalStickers
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: universal-stickers

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/universal-stickers/cargo
  build-args:
    - --share=network

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: universal-stickers
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p universal-stickers
      - PREFIX=/app ./scripts/install-linux.sh
    sources:
      - type: dir
        path: ../..
